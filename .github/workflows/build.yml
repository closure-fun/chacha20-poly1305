name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - { name: linux-gcc,     os: ubuntu-latest,   cxx: g++ }
        - { name: linux-clang,   os: ubuntu-latest,   cxx: clang++ }
        - { name: windows-msvc,  os: windows-latest,  cxx: cl,       extra: "" }
        - { name: windows-clang, os: windows-latest,  cxx: clang-cl, extra: "-T ClangCL" }
        - { name: macos-clang,   os: macos-latest,    cxx: clang++ }

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: cmake -S . -B build -DCHACHA20_POLY1305_BUILD_BENCH=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}
      env:
        CXX: ${{ matrix.cxx }}

    - name: build
      run: cmake --build build --config Release

    - name: test
      run: ctest --test-dir build --build-config Release --output-on-failure
